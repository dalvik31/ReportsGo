apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: 'kotlin-parcelize'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'


apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    compileSdk 36
    defaultConfig {
        namespace("com.epacheco.reports")
        applicationId "com.epacheco.reports"
        minSdk 26
        targetSdk 36
        versionCode 28
        versionName "2.0.0.101125"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

    }

    signingConfigs {
        release {
            storeFile file("reports_keystore_release.jks")
            storePassword "Emma3103"
            keyAlias "reports"
            keyPassword "Emma3103"
        }

    }

    dataBinding {
        enabled = true
    }


    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')

        }
    }

    lintOptions {
        checkReleaseBuilds false

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '2.0.0'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

}


dependencies {
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0-alpha02'
    implementation 'com.google.android.material:material:1.3.0-alpha01'
    //Dependencia para navigationBottom
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    //Dependencia para descargar imagenes
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation platform('androidx.compose:compose-bom:2025.03.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.runtime:runtime-livedata:1.6.8'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.04.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    //Dependencia para inicio de sesion con twitter
    //Dependencia para inicio de sesion con facebook
    implementation 'com.facebook.android:facebook-android-sdk:5.15.3'

    //Dependencia para escanear codigo qr y codigo de barras
    implementation 'com.google.android.gms:play-services-vision:20.1.3'

    //Se agrego por un error al inflar el contraint layout con androidx
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0-alpha10'
    //Se agrego por un error al iniciar sesion con google

    //Se agrega para animacion lottie
    implementation 'com.airbnb.android:lottie:5.0.3'
    //Se agrega libreria para date range picker

    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))

    implementation 'com.github.yukuku:ambilwarna:2.0.1'
    //Libreia para los usar los mapas
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    //Libreria para implementar un floatingActionButton desplegable
    implementation 'com.getbase:floatingactionbutton:1.10.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'


    /****
     *
     *
     * IMPORTS TO REDESIGN COMPOSE
     *
     *
     * */

    //FIREBASE
    implementation platform('com.google.firebase:firebase-bom:34.5.0')
    //Login with email
    implementation 'com.google.firebase:firebase-auth'
    //Login with google
    implementation 'com.google.android.gms:play-services-auth'
    //Database
    implementation 'com.google.firebase:firebase-database'
    //Crashlytics
    implementation 'com.google.firebase:firebase-crashlytics'
    //Analytics
    implementation 'com.google.firebase:firebase-analytics'
    //Storage
    implementation 'com.google.firebase:firebase-storage'

    //Splash core
    implementation("androidx.core:core-splashscreen:1.0.1")

    //Dagger hilt
    implementation "com.google.dagger:hilt-android:2.48"
    kapt "com.google.dagger:hilt-android-compiler:2.48"

    //Extend icons
    implementation "androidx.compose.material:material-icons-extended:1.6.8"

    //Navigation
    implementation 'androidx.navigation:navigation-runtime-ktx:2.9.0-alpha04'
    implementation 'androidx.navigation:navigation-compose:2.9.0-alpha04'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    //Async images from URL
    //Async images from URL (using Coil 2 for compatibility)
    implementation("io.coil-kt:coil-compose:2.6.0")
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.0.0-rc01")

    //Lottie for Compose
    implementation("com.airbnb.android:lottie-compose:4.0.0")

    //Serialization
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2")

    //Compress images
    implementation 'id.zelory:compressor:3.0.1'

    //CheckPermissions
    implementation "com.google.accompanist:accompanist-permissions:0.37.3"

    //Login with Google
    implementation("androidx.credentials:credentials:1.3.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.3.0")
    implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")

}


apply plugin: 'com.google.gms.google-services'
apply plugin: 'org.jetbrains.kotlin.android'//Dependencia FireBase



